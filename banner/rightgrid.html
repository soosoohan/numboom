<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>넘스톤 배너 - 게임 화면</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  body {
    background: #444484;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Jua', sans-serif;
  }

  .grid {
    display: grid;
    gap: 10px;            /* 선 굵기 */
    padding: 10px;
    border-radius: 26px;
  }

  .cell {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    font-size: 48px;
  }
  .cell.long { font-size: 34px; }
  .cell.emoji { font-size: 75px; }
</style>
</head>
<body>

<div id="grid" class="grid"></div>

<script>
/* ===== 여기만 고치세요 ===== */
const CONFIG = {
  pageBg:  "#c41e3a",  
  line:    "#1a1a2e",  
  emojiBg: "#fce9dc",  

  cols: 4,
  cells: [                    
    "64",  "128",   "🍎", "8",
    "256",  "32",  "128", "4",
    "1024","🍒",  "256", "🍇",
    "2048","512", "16",  "2"
  ]
};

/* 숫자별 칸 색 (원래 게임 색을 파스텔로) */
const TILE = {
  
 2:      { bg: '#B8E986', fg: '#2F4F1F' },
 4:      { bg: '#7ED957', fg: '#FFFFFF' },
 8:      { bg: '#4DD0E1', fg: '#FFFFFF' },
 16:     { bg: '#42A5F5', fg: '#FFFFFF' },
 32:     { bg: '#7E57C2', fg: '#FFFFFF' },
 64:     { bg: '#EC407A', fg: '#FFFFFF' },
 128:    { bg: '#FFA726', fg: '#FFFFFF' },
 256:    { bg: '#FF7043', fg: '#FFFFFF' },
 512:    { bg: '#E53935', fg: '#FFFFFF' },
 1024:   { bg: '#B0BEC5', fg: '#263238' },
 2048:   { bg: '#FFF8E1', fg: '#F57C00' },
 4096:   { bg: '#FFE082', fg: '#8D6E00' },
 8192:   { bg: '#FFD54F', fg: '#6D4C00' },
 16384:  { bg: '#F8BBD0', fg: '#880E4F' },
 32768:  { bg: '#CE93D8', fg: '#4A148C' },
 65536:  { bg: '#90CAF9', fg: '#0D47A1' },
 131072: { bg: '#80CBC4', fg: '#004D40' }
};
/* ========================== */

document.body.style.background = CONFIG.pageBg;

const grid = document.getElementById("grid");
grid.style.background = CONFIG.line;
grid.style.gridTemplateColumns = `repeat(${CONFIG.cols}, 100px)`;

CONFIG.cells.forEach(v => {
  const d = document.createElement("div");
  const isNum = /^[0-9]+$/.test(v);
  const t = isNum ? TILE[v] : null;

  d.className = "cell" + (isNum ? (v.length >= 4 ? " long" : "") : " emoji");
  d.textContent = v;
  d.style.background = t ? t.bg : (isNum ? "#eee" : CONFIG.emojiBg);
  d.style.color = t ? t.fg : "#333";
  grid.appendChild(d);
});
</script>
</body>
</html>
